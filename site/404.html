<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    :root { --bg: #FBF6EC; --ink: #17262B; --muted: #56676C; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0F1C21; --ink: #F1EBDD; --muted: #9FB0B3; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink); font: 18px/1.6 ui-sans-serif, system-ui, sans-serif; padding: 16px; text-align: center; }
    h1 { font-size: 2.4rem; margin: 16px 0 8px; }
    p { color: var(--muted); max-width: 36ch; margin: 0 auto 24px; }
    a { color: inherit; font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <img src="/favicon.svg" alt="" width="72" height="72">
    <h1>404</h1>
    <p>This page doesn't exist. Honestly, deleting things is kind of my thing.</p>
    <a href="/">Back home</a>
  </main>
</body>
</html>
